DWAPlannerROS:
  # ── Robot configuration ─────────────────────────────────────────
  max_vel_x:     0.35
  min_vel_x:     0.0
  max_vel_trans: 0.35
  min_vel_trans: 0.10
  max_vel_theta: 1.0
  min_vel_theta: 0.3
  acc_lim_x:     0.5
  acc_lim_y:     0.0
  acc_lim_theta: 1.0

  # ── Goal tolerances ─────────────────────────────────────────────
  xy_goal_tolerance:    0.20
  yaw_goal_tolerance:   0.15
  latch_xy_goal_tolerance: false

  # ── Forward simulation ──────────────────────────────────────────
  sim_time:        2.5
  vx_samples:      20
  vy_samples:       0
  vth_samples:     40
  sim_granularity: 0.025

  # ── Trajectory scoring ──────────────────────────────────────────
  path_distance_bias:    32.0
  goal_distance_bias:    24.0
  occdist_scale:          0.01
  forward_point_distance: 0.325
  stop_time_buffer:       0.2
  scaling_speed:          0.25
  max_scaling_factor:     0.2

  # ── Oscillation prevention ──────────────────────────────────────
  oscillation_reset_dist: 0.05

  # ── Debug visualisation ─────────────────────────────────────────
  publish_traj_pc:      true
  publish_cost_grid_pc: true
